# ------------------------------------------------------------
# {{ incoming_port_from }} - {{ incoming_port_to }} TCP: {{ tcp_forwarding }} UDP: {{ udp_forwarding }}
# ------------------------------------------------------------

{% if enabled %}

{%- set port_range = incoming_port_from == incoming_port_to
    and incoming_port_from
    or incoming_port_from ~ '-' ~ incoming_port_to -%}

{# TCP forwarding #}
{% if tcp_forwarding %}
server {
  listen {{ port_range }}{% if certificate %} ssl{% endif %};
  {% unless ipv6 -%} # {%- endunless -%} listen [::]:{{ port_range }}{% if certificate %} ssl{% endif %};

  {% include "_certificates_stream.conf" %}

  proxy_pass {{ forwarding_host }}:{{ port_range }};

  # Custom
  include /data/nginx/custom/server_stream[.]conf;
  include /data/nginx/custom/server_stream_tcp[.]conf;
}
{% endif %}

{# UDP forwarding #}
{% if udp_forwarding %}
server {
  listen {{ port_range }} udp;
  {% unless ipv6 -%} # {%- endunless -%} listen [::]:{{ port_range }} udp;

  proxy_pass {{ forwarding_host }}:{{ port_range }};

  # Custom
  include /data/nginx/custom/server_stream[.]conf;
  include /data/nginx/custom/server_stream_udp[.]conf;
}
{% endif %}

{% endif %}
